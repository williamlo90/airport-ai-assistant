[project]
name = "airport-ai-assistant-backend"
version = "0.1.0"
description = "Modular backend for Airport AI Assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "certifi>=2025.1,<2027",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.32,<1",
]

[project.scripts]
airport-assistant-api = "airport_assistant.main:main"
airport-assistant-db-check = "airport_assistant.database_check:main"
airport-assistant-migrate = "airport_assistant.migrate:main"
airport-assistant-db-provision = "airport_assistant.provision:main"
airport-assistant-staff-credential = "airport_assistant.staff_credential:main"
airport-assistant-auth-setup = "airport_assistant.auth_setup:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airport_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "airport_assistant/_migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
