[project]
name = "airport-ai-assistant-backend"
version = "0.1.0"
description = "Modular backend for Airport AI Assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[project.scripts]
airport-assistant-api = "airport_assistant.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airport_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
