pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map "$status:$uri" $release_cache_control {
        default "no-store";
        ~^200:/assets/ "public, max-age=31536000, immutable";
    }
    server {
        listen 8443 ssl;
        ssl_certificate /etc/westbridge/tls/tls.crt;
        ssl_certificate_key /etc/westbridge/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        client_max_body_size 5m;
        add_header Cache-Control $release_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location /api/ {
            include /etc/nginx/westbridge-proxy.conf;
        }
        location /integrations/email/ { include /etc/nginx/westbridge-proxy.conf; }
        location /assets/ { try_files $uri =404; }
        location = /index.html { }
        location / { try_files $uri $uri/ /index.html; }
    }
}
